name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forexmatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Tests never reach a model or a live FX provider.
      FOREXMATCH_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/forexmatch_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/forexmatch_test
      MODEL_PROVIDER: mock
      FX_PROVIDER: static
      RESEARCH_PROVIDER: none
      ADMIN_SECRET: test-admin-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e "./backend[dev]"

      - name: Migrations apply cleanly
        working-directory: backend
        run: alembic upgrade head

      - name: Catalogue seeds without violating its own rules
        working-directory: backend
        run: python scripts/seed_cards.py --dry-run

      - name: Tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
